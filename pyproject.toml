[project]
name = "bug-spray"
version = "0.1.0"
description = "Bug bounty program radar & triage assistant — discovery and monitoring, human-in-the-loop triage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "keyring>=25.0",
]

[project.scripts]
bug-spray = "bug_spray.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bug_spray"]
